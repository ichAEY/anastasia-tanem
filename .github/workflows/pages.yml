name: Deploy Anastasia to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Try to enable GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          if [ "$code" = "404" ]; then
            curl -sS -o /tmp/pages-create.json -w "%{http_code}\n" -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
              -d '{"build_type":"workflow"}' || true
          fi

      - name: Resolve Pages base path
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" > /tmp/pages-current.json
          cname=$(node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('/tmp/pages-current.json','utf8')); process.stdout.write(p.cname || '')")
          repo_name="${GITHUB_REPOSITORY#*/}"
          if [ -n "$cname" ]; then
            echo "NEXT_PUBLIC_BASE_PATH=" >> "$GITHUB_ENV"
          else
            echo "NEXT_PUBLIC_BASE_PATH=/$repo_name" >> "$GITHUB_ENV"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Remove old exported Next assets
        run: rm -rf public/_next

      - name: Optimize Anastasia images
        run: |
          npm install --no-save --no-package-lock sharp
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const sharp = require('sharp');

          const inputDir = 'public/assets/anastasia-originals/anastasia-originals';
          const outputDir = 'public/assets/anastasia-optimized';
          fs.mkdirSync(outputDir, { recursive: true });

          const gallery = [
            'anastasia-photo1.png',
            'anastasia-photo3.png',
            'anastasia-photo4.png',
            'anastasia-photo5.png',
            'anastasia-photo6.png',
            'anastasia-photo7.png',
            'anastasia-photo8.png',
            'anastasia-photo9.png',
            'anastasia-photo10.png',
            'anastasia-photo11.png',
            'anastasia-photo12.png',
            'anastasia-photo13.png',
          ];

          async function optimize(filename, maxSize = 1500, quality = 86) {
            const source = path.join(inputDir, filename);
            if (!fs.existsSync(source)) {
              console.warn(`Missing image: ${source}`);
              return;
            }
            const output = path.join(outputDir, filename.replace(/\.[^.]+$/, '.webp'));
            await sharp(source)
              .rotate()
              .resize({ width: maxSize, height: maxSize, fit: 'inside', withoutEnlargement: true })
              .webp({ quality, effort: 5, smartSubsample: true })
              .toFile(output);
            const kb = Math.round(fs.statSync(output).size / 1024);
            console.log(`${filename} -> ${path.basename(output)} (${kb} KB)`);
          }

          (async () => {
            for (const filename of gallery) await optimize(filename, 1500, 86);
            await optimize('anastasia-actia1.png', 1600, 86);
            await optimize('anastasia-omastere.png', 1600, 87);
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Personalize desktop and preloader source
        run: |
          node - <<'NODE'
          const fs = require('fs');

          const mobilePath = 'app/mobile-claytone.tsx';
          let mobileSource = fs.readFileSync(mobilePath, 'utf8');
          mobileSource = mobileSource
            .replace('<span>ClayTone</span>', '<span>A</span>')
            .replace('<small>Nail studio</small>', '<small>ANASTASIA</small>')
            .replace('src="/assets/nonna-portrait.jpeg"', 'src="/assets/anastasia-optimized/anastasia-omastere.webp"')
            .replace('alt="Нонна, мастер ногтевого сервиса ClayTone"', 'alt="Анастасия — мастер бьюти-сервиса"')
            .replace('<figcaption><span>ClayTone</span><small>Индивидуальная работа мастера</small></figcaption>', '<figcaption><span>Анастасия</span><small>10 лет опыта</small></figcaption>');
          fs.writeFileSync(mobilePath, mobileSource);

          const sitePath = 'app/anastasia-site.tsx';
          let siteSource = fs.readFileSync(sitePath, 'utf8');
          siteSource = siteSource.replace(/\n\s*tab\.scrollIntoView\(\{ behavior: "smooth", block: "nearest", inline: "center" \}\);/g, '');
          fs.writeFileSync(sitePath, siteSource);
          NODE

      - name: Ignore hosting-only TypeScript files for Pages build
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'tsconfig.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          config.exclude = [
            ...(config.exclude || []),
            'db/**',
            'worker/**',
            'examples/**',
            'build/**',
            'drizzle/**',
            'drizzle.config.ts',
            'vite.config.ts'
          ];
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n');
          NODE

      - name: Build static site
        run: npx next build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
