name: Deploy Anastasia to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Try to enable GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          if [ "$code" = "404" ]; then
            curl -sS -o /tmp/pages-create.json -w "%{http_code}\n" -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
              -d '{"build_type":"workflow"}' || true
          fi

      - name: Resolve Pages base path
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" > /tmp/pages-current.json
          cname=$(node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('/tmp/pages-current.json','utf8')); process.stdout.write(p.cname || '')")
          repo_name="${GITHUB_REPOSITORY#*/}"
          if [ -n "$cname" ]; then
            echo "NEXT_PUBLIC_BASE_PATH=" >> "$GITHUB_ENV"
          else
            echo "NEXT_PUBLIC_BASE_PATH=/$repo_name" >> "$GITHUB_ENV"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Remove old exported Next assets
        run: rm -rf public/_next

      - name: Personalize preloader source
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'app/mobile-claytone.tsx';
          let source = fs.readFileSync(path, 'utf8');
          source = source
            .replace('<span>ClayTone</span>', '<span>A</span>')
            .replace('<small>Nail studio</small>', '<small>ANASTASIA</small>');
          fs.writeFileSync(path, source);
          NODE

      - name: Ignore hosting-only TypeScript files for Pages build
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'tsconfig.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          config.exclude = [
            ...(config.exclude || []),
            'db/**',
            'worker/**',
            'examples/**',
            'build/**',
            'drizzle/**',
            'drizzle.config.ts',
            'vite.config.ts'
          ];
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n');
          NODE

      - name: Build static site
        run: npx next build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
